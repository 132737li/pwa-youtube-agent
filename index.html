<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lionel AI Growth Agent</title>

    <!-- Manifest & Icônes -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./app_icon.png">
    <link rel="apple-touch-icon" href="./app_icon.png">

    <!-- Métadonnées PWA -->
    <meta name="theme-color" content="#080814">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #080814;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <!-- Iframe vers votre application Streamlit -->
    <iframe src="https://leoncorazon-ai-26.streamlit.app/?embed=true&show_footer=false"
        allow="microphone; camera; autoplay"></iframe>

    <script>
        // Enregistrement du Service Worker (indispensable pour Android)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(function (registration) {
                        console.log('Service Worker enregistré avec succès :', registration.scope);
                    })
                    .catch(function (error) {
                        console.error('Échec de l\'enregistrement du Service Worker :', error);
                    });
            });
        }
    </script>
</body>

</html>
